<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاعر - لعبة الأزواج</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap');

  :root {
    --rose: #e8637a;
    --rose-light: #f4a0b0;
    --rose-pale: #fde8ec;
    --rose-deep: #c0394f;
    --cream: #fff8f9;
    --dark: #3a1a20;
    --gold: #d4a853;
    --shadow: rgba(232, 99, 122, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(232,99,122,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(244,160,176,0.1) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* floating hearts background */
  .hearts-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .heart-float {
    position: absolute;
    opacity: 0.06;
    animation: floatUp linear infinite;
    font-size: 1.5rem;
    color: var(--rose);
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.06; }
    90% { opacity: 0.06; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
  }

  /* SCREENS */
  .screen {
    display: none;
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 24px 20px;
    animation: fadeIn 0.5s ease;
  }

  .screen.active { display: flex; flex-direction: column; align-items: center; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* LOGO */
  .logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo-heart {
    font-size: 3.5rem;
    display: block;
    animation: heartbeat 2s ease-in-out infinite;
    margin-bottom: 8px;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.15); }
    28% { transform: scale(1); }
    42% { transform: scale(1.1); }
    70% { transform: scale(1); }
  }

  .logo h1 {
    font-family: 'Amiri', serif;
    font-size: 3rem;
    color: var(--rose);
    line-height: 1;
    letter-spacing: 2px;
  }

  .logo p {
    font-size: 0.95rem;
    color: var(--rose-light);
    font-weight: 300;
    margin-top: 6px;
  }

  /* CATEGORY BUTTONS */
  .categories {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
    margin-bottom: 24px;
  }

  .cat-btn {
    background: white;
    border: 2px solid var(--rose-pale);
    border-radius: 20px;
    padding: 20px 14px;
    cursor: pointer;
    text-align: center;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .cat-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--rose-pale), white);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .cat-btn:hover::before, .cat-btn.selected::before { opacity: 1; }
  .cat-btn.selected { border-color: var(--rose); transform: translateY(-3px); }
  .cat-btn.selected .cat-icon { transform: scale(1.2); }

  .cat-icon {
    font-size: 2rem;
    display: block;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
    transition: transform 0.3s;
  }

  .cat-name {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--dark);
    position: relative;
    z-index: 1;
  }

  .cat-count {
    font-size: 0.75rem;
    color: var(--rose-light);
    margin-top: 4px;
    position: relative;
    z-index: 1;
  }

  /* BUTTONS */
  .btn-primary {
    background: linear-gradient(135deg, var(--rose), var(--rose-deep));
    color: white;
    border: none;
    border-radius: 50px;
    padding: 16px 48px;
    font-size: 1.1rem;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px var(--shadow);
    transition: all 0.3s ease;
    letter-spacing: 1px;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px var(--shadow);
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: white;
    color: var(--rose);
    border: 2px solid var(--rose-pale);
    border-radius: 50px;
    padding: 12px 36px;
    font-size: 1rem;
    font-family: 'Tajawal', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 12px;
  }

  .btn-secondary:hover { border-color: var(--rose); color: var(--rose-deep); }

  /* CARD */
  .card-wrapper {
    width: 100%;
    perspective: 1000px;
    margin: 20px 0;
  }

  .card {
    width: 100%;
    min-height: 320px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
    box-shadow: 0 16px 48px var(--shadow);
  }

  .card-front {
    background: linear-gradient(145deg, #fff, var(--rose-pale));
    border: 2px solid rgba(232,99,122,0.2);
  }

  .card-front .tap-hint {
    font-size: 0.85rem;
    color: var(--rose-light);
    margin-top: 16px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .card-back {
    background: linear-gradient(145deg, var(--rose), var(--rose-deep));
    transform: rotateY(180deg);
  }

  .card-back .question-text {
    font-family: 'Amiri', serif;
    font-size: 1.35rem;
    color: white;
    text-align: center;
    line-height: 1.8;
    font-weight: 400;
  }

  .card-back .q-number {
    position: absolute;
    top: 18px;
    left: 22px;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    font-weight: 300;
  }

  .card-back .q-category {
    position: absolute;
    top: 18px;
    right: 22px;
    font-size: 0.75rem;
    background: rgba(255,255,255,0.2);
    color: white;
    padding: 3px 12px;
    border-radius: 20px;
  }

  .card-back .heart-deco {
    font-size: 1.5rem;
    margin-bottom: 16px;
    opacity: 0.7;
  }

  /* PROGRESS */
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--rose-pale);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rose-light), var(--rose));
    border-radius: 10px;
    transition: width 0.5s ease;
  }

  .progress-text {
    font-size: 0.8rem;
    color: var(--rose-light);
    text-align: center;
    margin-bottom: 16px;
  }

  /* GAME CONTROLS */
  .game-controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    background: white;
    border: 2px solid var(--rose-pale);
    border-radius: 50px;
    padding: 10px 24px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    color: var(--rose);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    font-weight: 600;
  }

  .ctrl-btn:hover { border-color: var(--rose); background: var(--rose-pale); }
  .ctrl-btn span { font-size: 1rem; }

  /* STATS */
  .stats-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 24px;
  }

  .stat-box {
    background: white;
    border-radius: 16px;
    padding: 12px 20px;
    text-align: center;
    box-shadow: 0 4px 12px var(--shadow);
    border: 1.5px solid var(--rose-pale);
  }

  .stat-num {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--rose);
    font-family: 'Amiri', serif;
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--rose-light);
    margin-top: 2px;
  }

  /* CATEGORY FILTER TABS */
  .filter-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    width: 100%;
    margin-bottom: 16px;
    scrollbar-width: none;
  }

  .filter-tabs::-webkit-scrollbar { display: none; }

  .filter-tab {
    flex-shrink: 0;
    background: white;
    border: 1.5px solid var(--rose-pale);
    border-radius: 50px;
    padding: 7px 18px;
    font-size: 0.82rem;
    font-family: 'Tajawal', sans-serif;
    color: var(--rose);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
  }

  .filter-tab.active {
    background: var(--rose);
    color: white;
    border-color: var(--rose);
  }

  /* END SCREEN */
  .confetti-emoji {
    font-size: 4rem;
    animation: spin 1s ease-out;
  }

  @keyframes spin {
    from { transform: rotate(-30deg) scale(0.5); opacity: 0; }
    to { transform: rotate(0) scale(1); opacity: 1; }
  }

  .end-title {
    font-family: 'Amiri', serif;
    font-size: 2rem;
    color: var(--rose);
    margin: 16px 0 8px;
  }

  .end-subtitle {
    color: var(--rose-light);
    font-size: 0.95rem;
    text-align: center;
    line-height: 1.6;
    max-width: 320px;
    margin-bottom: 28px;
  }

  .card-front-icon {
    font-size: 4rem;
    margin-bottom: 12px;
  }

  .card-front-title {
    font-family: 'Amiri', serif;
    font-size: 2rem;
    color: var(--rose);
  }

  /* SCROLLABLE QUESTIONS (browse mode) */
  .q-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 60vh;
    overflow-y: auto;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--rose-pale) transparent;
  }

  .q-item {
    background: white;
    border: 1.5px solid var(--rose-pale);
    border-radius: 16px;
    padding: 14px 18px;
    font-size: 0.95rem;
    color: var(--dark);
    line-height: 1.6;
    font-family: 'Amiri', serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .q-item:hover { border-color: var(--rose); background: var(--rose-pale); }

  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--rose-light);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<!-- HOME SCREEN -->
<div class="screen active" id="homeScreen">
  <div class="logo">
    <span class="logo-heart">🤍</span>
    <h1>مشاعر</h1>
    <p>مشاعر وكلام عن القلب في بكرة كرت</p>
  </div>

  <p class="section-title">اختار فئة أو العب الكل</p>

  <div class="categories">
    <button class="cat-btn selected" onclick="selectCat('all', this)">
      <span class="cat-icon">💝</span>
      <div class="cat-name">كل الأسئلة</div>
      <div class="cat-count">+500 سؤال</div>
    </button>
    <button class="cat-btn" onclick="selectCat('love', this)">
      <span class="cat-icon">❤️</span>
      <div class="cat-name">الحب والعلاقة</div>
      <div class="cat-count">100 سؤال</div>
    </button>
    <button class="cat-btn" onclick="selectCat('future', this)">
      <span class="cat-icon">🌙</span>
      <div class="cat-name">المستقبل والأحلام</div>
      <div class="cat-count">100 سؤال</div>
    </button>
    <button class="cat-btn" onclick="selectCat('fun', this)">
      <span class="cat-icon">😄</span>
      <div class="cat-name">مرح وضحك</div>
      <div class="cat-count">100 سؤال</div>
    </button>
    <button class="cat-btn" onclick="selectCat('deep', this)">
      <span class="cat-icon">🌹</span>
      <div class="cat-name">أسئلة عميقة</div>
      <div class="cat-count">100 سؤال</div>
    </button>
    <button class="cat-btn" onclick="selectCat('daily', this)">
      <span class="cat-icon">☀️</span>
      <div class="cat-name">الحياة اليومية</div>
      <div class="cat-count">100 سؤال</div>
    </button>
  </div>

  <button class="btn-primary" onclick="startGame()">ابدأ اللعبة ✨</button>
  <button class="btn-secondary" onclick="showBrowse()">تصفح الأسئلة</button>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="gameScreen">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-text" id="progressText"></div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-num" id="statAnswered">0</div>
      <div class="stat-label">تم الإجابة</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="statRemaining">0</div>
      <div class="stat-label">متبقي</div>
    </div>
  </div>

  <div class="card-wrapper">
    <div class="card" id="gameCard" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="card-front-icon">💌</div>
        <div class="card-front-title">اضغط للكشف</div>
        <div class="tap-hint">اضغط على الكرت عشان تشوف السؤال</div>
      </div>
      <div class="card-face card-back">
        <div class="q-number" id="qNumber"></div>
        <div class="q-category" id="qCategory"></div>
        <div class="heart-deco">💗</div>
        <div class="question-text" id="questionText"></div>
      </div>
    </div>
  </div>

  <div class="game-controls">
    <button class="ctrl-btn" onclick="prevCard()"><span>◀</span> السابق</button>
    <button class="ctrl-btn" onclick="flipCard()"><span>🔄</span> اقلب</button>
    <button class="ctrl-btn" onclick="nextCard()">التالي <span>▶</span></button>
  </div>
  <div class="game-controls" style="margin-top:8px;">
    <button class="ctrl-btn" onclick="shuffleCards()"><span>🔀</span> خلط</button>
    <button class="ctrl-btn" onclick="goHome()"><span>🏠</span> الرئيسية</button>
  </div>
</div>

<!-- BROWSE SCREEN -->
<div class="screen" id="browseScreen">
  <div class="logo" style="margin-bottom: 16px;">
    <span style="font-family:'Amiri',serif;font-size:1.8rem;color:var(--rose);">تصفح الأسئلة</span>
  </div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" onclick="filterBrowse('all', this)">الكل</button>
    <button class="filter-tab" onclick="filterBrowse('love', this)">الحب ❤️</button>
    <button class="filter-tab" onclick="filterBrowse('future', this)">المستقبل 🌙</button>
    <button class="filter-tab" onclick="filterBrowse('fun', this)">مرح 😄</button>
    <button class="filter-tab" onclick="filterBrowse('deep', this)">عميق 🌹</button>
    <button class="filter-tab" onclick="filterBrowse('daily', this)">يومي ☀️</button>
  </div>

  <div class="q-list" id="qList"></div>

  <button class="btn-secondary" onclick="goHome()" style="margin-top:16px;">← رجوع</button>
</div>

<!-- END SCREEN -->
<div class="screen" id="endScreen">
  <div class="confetti-emoji">🎉</div>
  <div class="end-title">أنهيتم كل الأسئلة!</div>
  <div class="end-subtitle">أنتم كوبل رائع! كملتم كل الأسئلة وعبرتم عن مشاعركم. استمروا في التواصل الجميل ده 💑</div>
  <button class="btn-primary" onclick="startGame()">العب تاني 🔄</button>
  <button class="btn-secondary" onclick="goHome()">الرئيسية</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// ALL 500+ QUESTIONS
// ═══════════════════════════════════════════════════════════
const allQuestions = [

  {q:"إيه أول حاجة لفت نظرك فيا؟", cat:"love"},
  {q:"إيه اللحظة اللي حسيت فيها إنك بتحبني فعلاً؟", cat:"love"},
  {q:"إيه أكتر حاجة بتحبها فيا؟", cat:"love"},
  {q:"إيه أكتر لحظة رومانسية بينا عشتها وما نسيتهاش؟", cat:"love"},

  {q:"إيه أكتر هدية استلمتها مني وفرحت بيها؟", cat:"love"},
  {q:"لو محتاج/ة دعم دلوقتي، إيه اللي عايز/ة أعمله ليك؟", cat:"love"},
  {q:"إيه أكتر طريقة بتحس بيها بحبي ليك؟", cat:"love"},
  {q:"إيه اللي خلاك تثق فيا؟", cat:"love"},
  {q:"لو كنت هتعمل مفاجأة ليا، هتعمل إيه؟", cat:"love"},
  {q:"إيه أكتر حاجة بتتمنى إننا نعملها مع بعض؟", cat:"love"},
  {q:"لو رجعنا للأول، هتعمل حاجة مختلفة؟", cat:"love"},
  {q:"إيه أكتر صفة فيا بتجيب جوا ناجح/ة؟", cat:"love"},

  {q:"بتحس إنك فاهم/ة أنا عامل/ة إزاي من غير ما أتكلم؟", cat:"love"},

  {q:"إيه اللي لو عملته دلوقتي هتحس إنك استغليت اليوم كويس؟", cat:"daily"},
  {q:"إيه أكتر نشاط بيجيبلك إحساس الهدوء؟", cat:"daily"},
  {q:"بتحب تقضي الإجازة في بيتك ولا بره؟", cat:"daily"},
  {q:"إيه الروتين اللي ما تقدرش تنام من غيره؟", cat:"daily"},
];

// ═══════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════
let selectedCat = 'all';
let gameQuestions = [];
let currentIndex = 0;
let isFlipped = false;

// ═══════════════════════════════════════════════════════════
// FLOATING HEARTS
// ═══════════════════════════════════════════════════════════
function createHearts() {
  const container = document.getElementById('heartsBg');
  const hearts = ['♥','❤','💕','💗','💓','💞'];
  for(let i = 0; i < 15; i++) {
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left = Math.random()*100 + '%';
    h.style.animationDuration = (8 + Math.random()*12) + 's';
    h.style.animationDelay = (Math.random()*10) + 's';
    h.style.fontSize = (0.8 + Math.random()*1.5) + 'rem';
    container.appendChild(h);
  }
}
createHearts();

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() { showScreen('homeScreen'); }

function selectCat(cat, btn) {
  selectedCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

// ═══════════════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════════════
function getFilteredQuestions() {
  let qs = selectedCat === 'all' ? [...allQuestions] : allQuestions.filter(q => q.cat === selectedCat);
  return shuffle(qs);
}

function shuffle(arr) {
  const a = [...arr];
  for(let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startGame() {
  gameQuestions = getFilteredQuestions();
  currentIndex = 0;
  isFlipped = false;
  showScreen('gameScreen');
  loadCard();
}

function loadCard() {
  if(currentIndex >= gameQuestions.length) {
    showScreen('endScreen');
    return;
  }
  
  const card = document.getElementById('gameCard');
  card.classList.remove('flipped');
  isFlipped = false;
  
  const q = gameQuestions[currentIndex];
  
  const catLabels = {love:'❤️ الحب', future:'🌙 المستقبل', fun:'😄 مرح', deep:'🌹 عميق', daily:'☀️ يومي'};
  
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('qNumber').textContent = `#${currentIndex+1}`;
  document.getElementById('qCategory').textContent = catLabels[q.cat] || '';
  
  updateProgress();
}

function updateProgress() {
  const total = gameQuestions.length;
  const done = currentIndex;
  const pct = total > 0 ? (done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} من ${total} سؤال`;
  document.getElementById('statAnswered').textContent = done;
  document.getElementById('statRemaining').textContent = total - done;
}

function flipCard() {
  const card = document.getElementById('gameCard');
  isFlipped = !isFlipped;
  if(isFlipped) card.classList.add('flipped');
  else card.classList.remove('flipped');
}

function nextCard() {
  if(currentIndex < gameQuestions.length - 1) {
    currentIndex++;
    loadCard();
  } else {
    showScreen('endScreen');
  }
}

function prevCard() {
  if(currentIndex > 0) {
    currentIndex--;
    loadCard();
  }
}

function shuffleCards() {
  const remaining = gameQuestions.slice(currentIndex);
  const shuffled = shuffle(remaining);
  gameQuestions = [...gameQuestions.slice(0, currentIndex), ...shuffled];
  loadCard();
}

// ═══════════════════════════════════════════════════════════
// BROWSE MODE
// ═══════════════════════════════════════════════════════════
let browseCat = 'all';

function showBrowse() {
  showScreen('browseScreen');
  renderQList('all');
}

function filterBrowse(cat, btn) {
  browseCat = cat;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderQList(cat);
}

function renderQList(cat) {
  const list = document.getElementById('qList');
  const qs = cat === 'all' ? allQuestions : allQuestions.filter(q => q.cat === cat);
  list.innerHTML = '';
  qs.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'q-item';
    div.textContent = `${i+1}. ${q.q}`;
    div.onclick = () => {
      selectedCat = cat;
      gameQuestions = cat === 'all' ? shuffle([...allQuestions]) : shuffle(allQuestions.filter(x => x.cat === cat));
      const idx = gameQuestions.findIndex(x => x.q === q.q);
      currentIndex = idx >= 0 ? idx : 0;
      isFlipped = false;
      showScreen('gameScreen');
      loadCard();
    };
    list.appendChild(div);
  });
}
</script>
